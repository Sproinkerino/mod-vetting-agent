name: SEO production health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read

concurrency:
  group: seo-production-health
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "httpx>=0.27"
      - name: Audit canonical production pages
        run: python scripts/audit_seo.py --base https://reddit-pi.live
      - name: Verify IndexNow key and canonical URL batch
        run: python scripts/submit_indexnow.py --dry-run
